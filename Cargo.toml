[package]
name = "simple-network-monitor"
version = "0.0.2"
edition = "2024"
description = "ICMP and SSH usage monitoring daemon with a JSON API"
license = "MIT"
repository = "https://github.com/terjekv/simple-network-monitor"

[dependencies]
actix-web = "4.11"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
humantime-serde = "1.1"
humantime = "2.3"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
surge-ping = "0.9"
thiserror = "2"
tokio = { version = "1.47", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
subtle = "2"
r2d2 = "0.8.10"

[dev-dependencies]
rstest = "0.26"
tempfile = "3"
