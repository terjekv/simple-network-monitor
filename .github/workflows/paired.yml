name: Backend and frontend compatibility
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: backend
          persist-credentials: false
      - name: Validate approved immutable counterpart reference
        env:
          FRONTEND_REF: ${{ vars.SNM_FRONTEND_REF }}
        run: '[[ "$FRONTEND_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      # Repository settings select the approved executable counterpart.
      # Dispatch and reusable-workflow inputs must not choose code to run here.
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.SNM_FRONTEND_REPOSITORY || format('{0}/simple-network-monitor-frontend', github.repository_owner) }}
          ref: ${{ vars.SNM_FRONTEND_REF }}
          path: frontend
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust and browser prerequisites
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Check both projects and browser compatibility
        run: bash backend/scripts/check-projects.sh "$GITHUB_WORKSPACE/frontend"
      - name: Record exact checkout pair
        if: always()
        run: |
          git -C backend rev-parse HEAD > pair-revisions.txt
          git -C frontend rev-parse HEAD >> pair-revisions.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-evidence
          path: |
            pair-revisions.txt
            frontend/test-results/
