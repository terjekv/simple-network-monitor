[package]
name = "simple-network-monitor"
version = "0.0.2"
edition = "2024"
description = "ICMP and SSH usage monitoring daemon with a JSON API"
license = "MIT"
repository = "https://github.com/terjekv/simple-network-monitor"

[dependencies]
# The API uses HTTP/1.1; omit HTTP/2 to avoid h2 0.3 (RUSTSEC-2026-0258).
actix-web = { version = "4.15.0", default-features = false, features = [
    "macros", "compress-brotli", "compress-gzip", "compress-zstd",
    "cookies", "unicode", "compat", "ws",
] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
humantime-serde = "1.1.1"
humantime = "2.4.0"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
surge-ping = "0.9.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "vendored"] }
subtle = "2.6.1"
r2d2 = "0.8.10"

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3.27.0"
