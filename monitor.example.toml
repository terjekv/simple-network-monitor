# Copy to monitor.toml and adjust for your network.
#
# Unknown keys in any [table] or [[hosts]] block are rejected at startup
# (deny_unknown_fields) so typos surface immediately. Group named tables
# under [groups]; everything else goes at the top level or inside hosts.
# HTTP/1.1 listener. Use a reverse proxy for TLS or HTTP/2.
bind = "127.0.0.1:3000"
database_path = "./network-monitor.sqlite3"
# ICMP and usage change events retain one year of history (bounded maintenance batches).
history_retention = "365d"
# Optional. Limits Actix HTTP API worker threads. Omit to use Actix's default,
# which is based on available CPU parallelism.
# api_workers = 2
# Tiered observations for charts. Retention must increase with bucket width.
[history]
raw_retention = "3d"
five_minute_retention = "30d"
hourly_retention = "365d"
daily_retention = "1095d"
event_retention = "1095d"

# One persistent scheduler handles all database maintenance. No external cron needed.
[maintenance]
rollup_interval = "60s"
retention_interval = "5m"
reclaim_interval = "1h"
optimize_interval = "1d"
batch_size = 500
# Reclaim only when BOTH thresholds are met; freed pages are reusable meanwhile.
reclaim_min_bytes = 268435456
reclaim_free_percent = 20
reclaim_pages = 1000

[modules.icmp]
# "auto" tries raw ICMP first and falls back to system ping if raw sockets are not
# available. "system" forces the binary path, "raw" requires raw sockets.
backend = "system"
interval = "30s"
timeout = "1s"
# Maximum simultaneous ICMP checks. This is not the HTTP worker count.
concurrency = 128
failure_threshold = 2
success_threshold = 1

[modules.usage]
# Global gate for usage collection. Set this to true before enabling usage
# on individual hosts; per-host modules.usage.enabled can only opt hosts out.
enabled = false
interval = "5m"
timeout = "5s"
# Verify SSH host keys for usage collection by default. Set this to false only
# for environments where host keys are unreliable.
ssh_verify_host_key = true
# Maximum simultaneous usage SSH probes. This is separate from ICMP checks.
concurrency = 32
# Per-poll samples retain this window. Each write and periodic maintenance
# prune old samples, including hosts that have stopped polling. Change events
# use the global history_retention window, preserving a usage cutoff anchor.
sample_retention = "30d"
linux_min_uid = 1000
macos_min_uid = 500

[modules.tcp]
# Enable globally to activate the named checks configured on each host.
# /v1/modules reports this gate, including after a successful config reload.
enabled = false
interval = "30s"
# Includes DNS resolution and all connection attempts.
timeout = "3s"
concurrency = 64

[[hosts]]
id = "router-core-1"
address = "192.0.2.1"
name = "Core Router 1"
metadata = { room = "net-a", rack = "rack-1" }

# Usage OS defaults to autodetection with `uname -s`. Set os = "linux" or
# os = "macos" here only when you want to skip the probe for this host.
[hosts.modules.usage]
enabled = false
interval = "5m"

# Names are stable within this host's TCP module; ports must be 1..65535.
# Up to 64 checks per host. With the global gate off these remain disabled.
[hosts.modules.tcp]
checks = [{ id = "ssh", port = 22 }, { id = "web", port = 443 }]

[[hosts]]
id = "switch-edge-1"
address = "192.0.2.2"
name = "Edge Switch 1"
metadata = { room = "lab-2" }

# Groups can also be declared at the top level. Each host's effective
# group list is the union of its inline `groups = [...]` and any
# [groups] entries that name its id. Empty member lists are rejected.
[groups]
core = ["router-core-1"]
routers = ["router-core-1"]
edge = ["switch-edge-1"]
switches = ["switch-edge-1"]

# Group-level settings apply between global settings and per-host
# [hosts.modules.usage] settings. Keep host-key verification enabled unless
# an isolated legacy environment cannot maintain known-host entries.
[group_settings.edge.modules.usage]
ssh_verify_host_key = true
